version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /plugins/squad-chat/bridge
    target-branch: next
    schedule:
      interval: weekly
    groups:
      bridge:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /.github/ci-tools
    target-branch: next
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    target-branch: next
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
